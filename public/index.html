<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTC Data Mesh</title>

    <meta name="description" content="OTC Data Mesh — A landing page for distributed data services, tools, and DoD-focused capabilities." />
    <meta name="keywords" content="OTC, Data Mesh, DoD, Army Data, Data Services, Mesh Architecture" />
    <meta name="author" content="OTC Data Mesh Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="OTC Data Mesh" />
    <meta property="og:description" content="Empowering distributed data access and collaboration across the DoD ecosystem." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/assets/otc-datamesh-preview.png" />
    <meta property="og:site_name" content="OTC Data Mesh" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OTC Data Mesh" />
    <meta name="twitter:description" content="Empowering distributed data access and collaboration across the DoD ecosystem." />
    <meta name="twitter:image" content="https://your-domain.com/assets/otc-datamesh-preview.png" />
    <meta name="twitter:creator" content="@YourTwitterHandle" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />

    <!-- PWA + Theme -->
    <meta name="theme-color" content="#ffcc01" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body style="padding: 4rem" class="container">
    <!-- small buttons -->
    <button class="btn btn--primary btn--sm">Primary</button>
    <button class="btn btn--secondary btn--sm">Secondary</button>
    <button class="btn btn--ghost btn--sm">Ghost</button>
    <button class="btn btn--danger btn--sm">Danger</button>

    <!-- default size -->
    <button class="btn btn--primary">Primary</button>
    <button class="btn btn--secondary">Secondary</button>
    <button class="btn btn--ghost">Ghost</button>
    <button class="btn btn--danger">Danger</button>

    <!-- large -->
    <button class="btn btn--primary btn--lg">Primary</button>
    <button class="btn btn--secondary btn--lg">Secondary</button>
    <button class="btn btn--ghost btn--lg">Ghost</button>
    <button class="btn btn--danger btn--lg">Danger</button>

    <!-- disabled -->
    <button disabled class="btn btn--primary btn--lg">Primary</button>

    <!-- icon button -->
    <button class="btn btn--primary">
      <svg class="icon icon--light btn__icon" aria-hidden="true">
        <use href="/assets/icons/sprite.svg#search"></use>
      </svg>
      Search
    </button>

    <!-- full-width -->
    <button class="btn btn--danger btn--full">Full Danger Button</button>

    <script src="./js/main.js"></script>
  </body>
</html>
